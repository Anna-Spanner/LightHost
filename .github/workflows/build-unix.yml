name: Build Linux and macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-x64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch JUCE
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git lib/juice

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIGHTHOST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "LightHost_artefacts/Release/Light Host.app" "../dist/LightHost-${{ matrix.name }}.zip"
          else
            cp LightHost_artefacts/Release/"Light Host" "../dist/LightHost-${{ matrix.name }}"
            tar -czf "../dist/LightHost-${{ matrix.name }}.tar.gz" -C LightHost_artefacts/Release "Light Host" LightHostUpdater
          fi
          cd ../dist && (shasum -a 256 * | tee SHA256-${{ matrix.name }}.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: LightHost-${{ matrix.name }}
          path: dist/*
